<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Leaderboard ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF8F5;--card:#FFFFFF;--border:rgba(0,0,0,0.08);
  --text:#1A1A1A;--muted:#6B6B6B;--gold:#EF9F27;--purple:#7F77DD;
  --leg-bg:#EEEDFE;--leg-tx:#3C3489;
  --epi-bg:#E6F1FB;--epi-tx:#0C447C;
  --rar-bg:#FAEEDA;--rar-tx:#633806;
  --com-bg:#EAF3DE;--com-tx:#27500A;
  --cur-bg:#FBEAF0;--cur-tx:#72243E;
}
body{background:var(--bg);font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}
#app{max-width:940px;margin:0 auto;padding:2rem 1rem 7rem}

/* ── SETUP ── */
.setup-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1.5rem;padding:2rem}
.setup-logo{font-size:2rem;font-weight:500;letter-spacing:-.02em}
.setup-logo span{color:var(--gold)}
.setup-card{background:var(--card);border:.5px solid var(--border);border-radius:12px;
  padding:2rem;width:100%;max-width:440px;display:flex;flex-direction:column;gap:1rem}
.setup-card label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:.3rem}
.setup-card input{width:100%;padding:.6rem .75rem;border:.5px solid var(--border);
  border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);
  color:var(--text);outline:none;transition:border-color .15s}
.setup-card input:focus{border-color:var(--purple)}
.error-msg{background:#FEF2F2;border:.5px solid #FECACA;border-radius:6px;
  padding:.6rem .8rem;font-size:13px;color:#DC2626}

/* ── BUTTONS ── */
.btn-primary{padding:.65rem 1.25rem;background:var(--text);color:#fff;border:none;
  border-radius:6px;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;
  transition:opacity .15s}
.btn-primary:hover{opacity:.82}
.btn-sm{padding:.35rem .7rem;background:transparent;border:.5px solid var(--border);
  border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--muted);
  transition:all .15s}
.btn-sm:hover{border-color:var(--text);color:var(--text)}
.settings-btn{background:none;border:none;cursor:pointer;font-size:16px;
  color:var(--muted);padding:.25rem;line-height:1;transition:color .15s}
.settings-btn:hover{color:var(--text)}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.top-title{font-size:16px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.top-title .repo-name{color:var(--muted);font-weight:400;font-size:12px;margin-left:.4rem}
.top-actions{display:flex;gap:.5rem;align-items:center}

/* ── TAB BAR ── */
.tab-bar{display:flex;gap:.25rem;background:var(--card);border:.5px solid var(--border);
  border-radius:8px;padding:.3rem;margin-bottom:2rem;width:fit-content}
.tab-btn{padding:.45rem 1.1rem;border:none;border-radius:5px;font-size:13px;
  font-family:inherit;cursor:pointer;background:transparent;color:var(--muted);
  font-weight:500;transition:all .15s;display:flex;align-items:center;gap:.4rem}
.tab-btn.active{background:var(--bg);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-btn:hover:not(.active){color:var(--text)}

/* ── SECTION LABEL ── */
.section-label{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.75rem}

/* ── STAT STRIP ── */
.stats-strip{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem;
  margin-bottom:2rem;scrollbar-width:none}
.stats-strip::-webkit-scrollbar{display:none}
.stat-card{background:var(--card);border:.5px solid var(--border);border-radius:8px;
  padding:.75rem 1rem;min-width:100px;flex-shrink:0}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:.2rem;white-space:nowrap}
.stat-value{font-size:20px;font-weight:500;white-space:nowrap}
.stat-sub{font-size:11px;color:var(--muted);margin-top:.1rem}
.lang-pill{font-size:10px;padding:.1rem .45rem;border-radius:3px;
  background:var(--bg);border:.5px solid var(--border);color:var(--muted)}

/* ── DOC HEALTH ── */
.doc-health{background:var(--card);border:.5px solid var(--border);border-radius:8px;
  padding:1.25rem;margin-bottom:2rem}
.doc-health-inner{display:flex;gap:1.5rem;align-items:flex-start}
.grade-block{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:80px}
.grade-letter{font-size:56px;font-weight:500;line-height:1;
  animation:gradePulse 2.5s ease-in-out infinite}
.grade-score{font-size:13px;color:var(--muted);font-weight:500}
.grade-label{font-size:11px;color:var(--muted);text-align:center}
@keyframes gradePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.doc-signals{flex:1;display:flex;flex-direction:column;gap:.6rem}
.signal-row{display:flex;align-items:center;gap:.6rem}
.signal-icon{font-size:14px;width:18px;text-align:center}
.signal-name{font-size:12px;width:180px;flex-shrink:0}
.signal-bar-wrap{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.signal-bar{height:100%;border-radius:3px;transition:width .6s ease}
.signal-pts{font-size:11px;color:var(--muted);white-space:nowrap;min-width:50px;text-align:right}
.fix-list{margin-top:1rem;padding-top:1rem;border-top:.5px solid var(--border)}
.fix-list-title{font-size:11px;font-weight:500;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-bottom:.5rem}
.fix-item{font-size:12px;color:var(--muted);padding:.15rem 0}

/* ── LEADERBOARD GRID ── */
.leaderboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:1rem;margin-bottom:2rem}
.contributor-card{background:var(--card);border:.5px solid var(--border);border-radius:8px;
  padding:1rem;display:flex;flex-direction:column;gap:.55rem;
  transition:transform .15s ease,box-shadow .15s ease;cursor:default}
.contributor-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.contributor-card.rank-1{border:1.5px solid var(--gold)}
.sprite-wrap{display:flex;justify-content:center;height:48px;align-items:flex-end}
.card-header{display:flex;align-items:center;gap:.6rem}
.avatar{width:30px;height:30px;border-radius:50%;border:.5px solid var(--border)}
.card-name{font-size:13px;font-weight:500}
.card-name a{color:var(--text);text-decoration:none}
.card-name a:hover{color:var(--purple);text-decoration:underline}
.rank-badge{font-size:10px;font-weight:500;padding:.15rem .4rem;border-radius:3px;
  background:var(--bg);color:var(--muted);border:.5px solid var(--border)}
.rank-badge.gold{background:#FEF9EC;color:#92600A;border-color:#F5D07A}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.mini-stat-label{font-size:10px;color:var(--muted)}
.mini-stat-value{font-size:15px;font-weight:500}
.card-badges{display:flex;flex-wrap:wrap;gap:.3rem}

/* ── BADGE PILL ── */
.badge-pill{display:inline-flex;align-items:center;gap:.2rem;
  font-size:10px;font-weight:500;padding:.18rem .45rem;border-radius:20px;white-space:nowrap}
.badge-pill.legendary{background:var(--leg-bg);color:var(--leg-tx)}
.badge-pill.epic{background:var(--epi-bg);color:var(--epi-tx)}
.badge-pill.rare{background:var(--rar-bg);color:var(--rar-tx)}
.badge-pill.common{background:var(--com-bg);color:var(--com-tx)}
.badge-pill.cursed{background:var(--cur-bg);color:var(--cur-tx)}

/* ── SPARKLINE ── */
.sparkline-wrap{margin-top:.2rem}
.sparkline-label{font-size:10px;color:var(--muted);margin-bottom:.15rem}

/* ── HALL OF SHAME ── */
.shame-grid{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:2rem}
.shame-card{background:var(--card);border:.5px solid var(--border);border-radius:8px;
  padding:.9rem 1rem;flex:1;min-width:190px;max-width:300px}
.shame-icon{font-size:20px;margin-bottom:.25rem}
.shame-title{font-size:11px;font-weight:500;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2rem}
.shame-name{font-size:14px;font-weight:500}
.shame-roast{font-size:11px;color:var(--muted);margin-top:.2rem;line-height:1.5}

/* ══════════════════════════════════════
   PLAYERS TAB
══════════════════════════════════════ */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:1.25rem;margin-bottom:2rem}

.player-card{background:var(--card);border:.5px solid var(--border);border-radius:10px;
  padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;
  transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden}
.player-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.player-card.rank-1{border:1.5px solid var(--gold)}
.player-card.rank-2{border:1.5px solid #9CA3AF}
.player-card.rank-3{border:1.5px solid #C97E3B}

.player-sprite-wrap{display:flex;justify-content:center;align-items:flex-end;height:64px}

.player-identity{display:flex;align-items:center;gap:.75rem}
.player-avatar{width:38px;height:38px;border-radius:50%;border:.5px solid var(--border)}
.player-name-block{flex:1}
.player-username{font-size:14px;font-weight:500}
.player-username a{color:var(--text);text-decoration:none}
.player-username a:hover{color:var(--purple)}
.player-rank{font-size:11px;color:var(--muted)}

/* Level badge */
.level-badge{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;
  border-radius:7px;background:var(--bg);border:.5px solid var(--border)}
.level-num{font-size:22px;font-weight:500;line-height:1}
.level-info{display:flex;flex-direction:column;gap:.05rem}
.level-title{font-size:12px;font-weight:500}
.level-xp{font-size:10px;color:var(--muted)}

/* XP bar */
.xp-bar-wrap{display:flex;flex-direction:column;gap:.25rem}
.xp-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.xp-bar-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;
  border:.5px solid var(--border)}
.xp-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}

/* Player stats grid */
.player-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.player-mini{display:flex;flex-direction:column;align-items:center;
  background:var(--bg);border-radius:5px;padding:.4rem .3rem}
.player-mini-val{font-size:14px;font-weight:500}
.player-mini-lbl{font-size:9px;color:var(--muted);text-align:center}

/* Activity row */
.activity-row{display:flex;gap:.5rem;font-size:11px;color:var(--muted);flex-wrap:wrap}
.act-chip{background:var(--bg);border:.5px solid var(--border);border-radius:4px;
  padding:.1rem .4rem;white-space:nowrap}

/* Power score */
.power-score{position:absolute;top:.9rem;right:.9rem;display:flex;flex-direction:column;
  align-items:center;background:var(--bg);border:.5px solid var(--border);
  border-radius:6px;padding:.3rem .5rem}
.power-num{font-size:15px;font-weight:500;line-height:1}
.power-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* ── PLAYER STATS STRIP ── */
.player-stats-strip{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem;
  margin-bottom:2rem;scrollbar-width:none}
.player-stats-strip::-webkit-scrollbar{display:none}

/* ── MARQUEE / WANDERERS ── */
.wanderer-bar{position:fixed;bottom:36px;left:0;width:100%;pointer-events:none;
  z-index:50;height:56px;overflow:hidden}
.wanderer{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.wanderer-name{font-size:9px;font-weight:500;color:var(--muted);
  background:var(--card);border:.5px solid var(--border);border-radius:3px;
  padding:.05rem .3rem;white-space:nowrap;letter-spacing:.02em}
.w-go-right{animation:goRight var(--dur,14s) var(--delay,0s) linear infinite}
.w-go-left{animation:goLeft var(--dur,14s) var(--delay,0s) linear infinite}
@keyframes goRight{
  0%{transform:translateX(-80px) scaleX(1)}
  100%{transform:translateX(calc(100vw + 80px)) scaleX(1)}
}
@keyframes goLeft{
  0%{transform:translateX(calc(100vw + 80px)) scaleX(-1)}
  100%{transform:translateX(-80px) scaleX(-1)}
}

/* ── LOADING SKELETON ── */
.skeleton{background:linear-gradient(90deg,#f0ede8 25%,#e8e4de 50%,#f0ede8 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-strip{display:flex;gap:.75rem;margin-bottom:.75rem}
.skel-card{height:72px;flex:1;min-width:90px}
.skel-block{height:180px;width:100%;margin-bottom:.75rem}
.skel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.skel-lcard{height:200px}
.loading-wrap{padding:2rem 0;display:flex;flex-direction:column;gap:1rem}

/* ── SPRITE SVG ── */
.sprite-svg{image-rendering:pixelated;image-rendering:crisp-edges}
.spr-bounce{animation:spriteBounce .55s ease-in-out infinite}
@keyframes spriteBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;
  display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border-radius:12px;padding:1.5rem;
  width:90%;max-width:420px;display:flex;flex-direction:column;gap:1rem}
.modal-box input{width:100%;padding:.6rem .75rem;border:.5px solid var(--border);
  border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);
  color:var(--text);outline:none}

/* ── FOOTER ── */
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:.5px solid var(--border);padding:.4rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--muted);z-index:100}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .leaderboard-grid,.player-grid{grid-template-columns:1fr}
  .doc-health-inner{flex-direction:column}
  .player-stat-grid{grid-template-columns:repeat(2,1fr)}
  .grade-block{flex-direction:row;gap:1rem;min-width:auto}
  .signal-name{width:120px}
}
</style>
</head>

</div>

    rows:['.HHHHHH.', 'HhHHHHhH', '.HSShH..', '..HHHH..', '.GGGGGG.', '.bBBBBb.', 'bBBBBBBb', '.bBBBBb.', '..bGGb..', 'Wb....bW', 'Wb....bW', '.DD..DD.'] },
];

function renderSprite(idx, px=4, cls='spr-bounce') {
  const s = SPRITES[idx % SPRITES.length];
  const cols = s.rows[0].length, rows = s.rows.length;
  let rects = '';
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    const col = s.pal[s.rows[r][c]];
    if (col) rects += `<rect x="${c*px}" y="${r*px}" width="${px}" height="${px}" fill="${col}"/>`;
  }
  return `<svg class="sprite-svg ${cls}" width="${cols*px}" height="${rows*px}" viewBox="0 0 ${cols*px} ${rows*px}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

/* ═══════════════════════════════════════════
   API LAYER
═══════════════════════════════════════════ */
const _cache = new Map();
let apiCallCount = 0;
const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const getRepo  = () => localStorage.getItem(REPO_KEY)  || '';

async function ghFetch(path, raw=false) {
  const url = path.startsWith('http') ? path : `${API_BASE}${path}`;
  if (_cache.has(url)) return _cache.get(url);
  const resp = await fetch(url, { headers:{
    Authorization:`Bearer ${getToken()}`,
    Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
  }});
  apiCallCount++;
  document.getElementById('api-counter').textContent = `${apiCallCount} / 5000 API calls`;
  if (resp.status===202) return {_computing:true};
  if (resp.status===401) throw Object.assign(new Error('Bad token — check your PAT'),{status:401});
  if (resp.status===404) throw Object.assign(new Error('Repo not found'),{status:404});
  if (!resp.ok) throw new Error(`API error ${resp.status}`);
  const data = raw ? await resp.text() : await resp.json();
  const result = {data, headers:resp.headers, linkHeader:resp.headers.get('Link')};
  _cache.set(url, result);
  return result;
}

async function fetchAllPages(path, limit=500) {
  let results=[], url=`${API_BASE}${path}${path.includes('?')?'&':'?'}per_page=100`;
  while (url && results.length<limit) {
    const {data, linkHeader} = await ghFetch(url);
    results = results.concat(data);
    const m = linkHeader && linkHeader.match(/<([^>]+)>;\s*rel="next"/);
    url = m ? m[1] : null;
  }
  return results;
}

async function pollStats(path, retries=3) {
  for (let i=0;i<retries;i++) {
    const r = await ghFetch(path);
    if (!r._computing) return r;
    await new Promise(r=>setTimeout(r,3000*(i+1)));
    _cache.delete(`${API_BASE}${path}`);
  }
  return null;
}

/* ═══════════════════════════════════════════
   GAMIFICATION
═══════════════════════════════════════════ */
function computeXP(m, badgeCount) {
  return Math.floor(
    (m.total_commits||0) * 15 +
    (m.lines_added||0) / 50 +
    (m.lines_deleted||0) / 150 +
    (m.streak||0) * 12 +
    (badgeCount||0) * 80 +
    (m.early_commits||0) * 6 +
    (m.night_commits||0) * 4 +
    (m.friday_commits||0) * 3
  );
}

function getLevelData(xp) {
  let lvl = XP_LEVELS[0], idx = 0;
  for (let i=0;i<XP_LEVELS.length;i++) {
    if (xp >= XP_LEVELS[i].min) { lvl = XP_LEVELS[i]; idx = i; }
    else break;
  }
  const next = XP_LEVELS[idx+1];
  const progress = next ? Math.round(((xp - lvl.min) / (next.min - lvl.min)) * 100) : 100;
  return { ...lvl, idx: idx+1, progress, nextXP: next?.min, xp };
}

/* ═══════════════════════════════════════════
   DATA PROCESSING
═══════════════════════════════════════════ */
function daysAgo(n) { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function timeAgo(iso) {
  const d = Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  return d===0?'today':d===1?'yesterday':`${d}d ago`;
}

function computeStreak(dateSet) {
  const days=[...dateSet].sort(); if (!days.length) return 0;
  let max=1,cur=1;
  for (let i=1;i<days.length;i++) {
    const diff=new Date(days[i])-new Date(days[i-1]);
    if (diff<=86400000*1.5) cur++; else cur=1;
    if (cur>max) max=cur;
  }
  return max;
}

function computeContributorMetrics(statsData, commitList) {
  const thirtyAgo = Date.now() - 30*24*60*60*1000;
  const metrics = {};
  for (const c of statsData) {
    if (!c.author) continue;
    const login = c.author.login;
    metrics[login] = {
      login, avatar:c.author.avatar_url,
      total_commits:0, lines_added:0, lines_deleted:0,
      night_commits:0, early_commits:0, friday_commits:0,
      streak:0, avg_gap_hours:Infinity,
      commit_days:new Set(), commit_timestamps:[], weekly_commits:[],
    };
    for (const w of c.weeks) {
      if ((w.w+7*86400)*1000 >= thirtyAgo) {
        metrics[login].total_commits += w.c;
        metrics[login].lines_added   += w.a;
        metrics[login].lines_deleted += w.d;
        metrics[login].weekly_commits.push({ts:w.w*1000,c:w.c});
      }
    }
  }
  for (const commit of commitList) {
    const login = commit.author?.login;
    if (!login || !metrics[login]) continue;
    const date = new Date(commit.commit.author.date);
    const hour = date.getUTCHours(), dow = date.getUTCDay();
    const ds = date.toISOString().split('T')[0];
    if (hour>=18) metrics[login].night_commits++;
    if (hour<10)  metrics[login].early_commits++;
    if (dow===5)  metrics[login].friday_commits++;
    metrics[login].commit_days.add(ds);
    metrics[login].commit_timestamps.push(date.getTime());
  }
  for (const m of Object.values(metrics)) {
    m.streak = computeStreak(m.commit_days);
    const ts = [...m.commit_timestamps].sort((a,b)=>a-b);
    if (ts.length>1) {
      const gaps = ts.slice(1).map((t,i)=>t-ts[i]);
      m.avg_gap_hours = gaps.reduce((a,b)=>a+b,0)/gaps.length/3600000;
    }
  }
  return Object.fromEntries(Object.entries(metrics).filter(([,m])=>m.total_commits>0));
}

function assignBadges(metricsMap) {
  const list=Object.values(metricsMap), badgeMap={};
  for (const login of Object.keys(metricsMap)) badgeMap[login]=[];
  for (const badge of BADGE_DEFS) {
    const scored=list.map(m=>({login:m.login,val:badge.metric(m)}));
    const max=Math.max(...scored.map(v=>v.val));
    if (max<=0) continue;
    for (const s of scored) if (s.val===max) badgeMap[s.login].push(badge);
  }
  return badgeMap;
}

function isLazyCommit(msg) {
  if (!msg) return true;
  const c = msg.trim().toLowerCase().split('\n')[0];
  return c.length<10 || LAZY_MESSAGES.has(c);
}

/* ═══════════════════════════════════════════
   DOC HEALTH
═══════════════════════════════════════════ */
async function computeDocHealth(repo) {
  const result={scores:{},total:0,fixList:[],missingDirs:[]};
  const CODE_EXTS=['.js','.ts','.py','.java','.go','.rb','.cs','.cpp','.c','.rs'];
  const isReadme = n=>['readme.md','readme.rst','readme','readme.txt'].includes(n.toLowerCase());
  const isMd     = n=>n.toLowerCase().endsWith('.md');
  const isCode   = n=>CODE_EXTS.some(e=>n.toLowerCase().endsWith(e));
  let rootItems=[];
  try { const {data}=await ghFetch(`/repos/${repo}/contents/`); rootItems=Array.isArray(data)?data:[]; }
  catch(e){return result;}
  const rootFiles=rootItems.filter(i=>i.type==='file');
  const rootDirs =rootItems.filter(i=>i.type==='dir'&&!i.name.startsWith('.'));
  // 1. Root README
  const hasRootReadme=rootFiles.some(f=>isReadme(f.name));
  result.scores.readme=hasRootReadme?25:0;
  if (!hasRootReadme) result.fixList.push('📄 No root README found');
  // 2. Subdir coverage
  let dirsWithDocs=0;
  await Promise.all(rootDirs.slice(0,20).map(async dir=>{
    try {
      const {data}=await ghFetch(`/repos/${repo}/contents/${dir.name}`);
      const items=Array.isArray(data)?data:[];
      if (items.some(f=>f.type==='file'&&(isReadme(f.name)||isMd(f.name)))) dirsWithDocs++;
      else result.missingDirs.push(dir.name);
    } catch(e){result.missingDirs.push(dir.name);}
  }));
  result.scores.subdir=Math.round(30*(dirsWithDocs/Math.max(Math.min(rootDirs.length,20),1)));
  for (const d of result.missingDirs) result.fixList.push(`📂 /${d} is missing a README`);
  // 3. Comment density
  const codeFiles=rootItems.filter(i=>i.type==='file'&&isCode(i.name)).slice(0,5);
  let totalLines=0, commentLines=0;
  await Promise.all(codeFiles.map(async f=>{
    try {
      const {data:raw}=await ghFetch(f.download_url,true);
      const lines=raw.split('\n');
      totalLines+=lines.length;
      for (const l of lines) {
        const t=l.trim();
        if (t.startsWith('//')||t.startsWith('#')||t.startsWith('/*')||t.startsWith('*')||t.startsWith('"""')||t.startsWith("'''")) commentLines++;
      }
    }catch(e){}
  }));
  result.scores.comments=totalLines>0?Math.round(20*Math.min(1,(commentLines/totalLines)/0.15)):10;
  if (totalLines>0&&(commentLines/totalLines)<0.05) result.fixList.push('💬 Very low comment density');
  // 4. Config docs
  const CONFIG_FILES=['.env.example','docker-compose.yml','makefile','dockerfile'];
  const rootFileNames=rootFiles.map(f=>f.name.toLowerCase());
  const foundConfigs=CONFIG_FILES.filter(c=>rootFileNames.includes(c));
  if (rootItems.some(i=>i.name.toLowerCase()==='.github')) foundConfigs.push('.github');
  const docedConfigs=foundConfigs.filter(()=>rootFiles.some(f=>isReadme(f.name)));
  result.scores.configs=foundConfigs.length>0?Math.round(15*(docedConfigs.length/foundConfigs.length)):8;
  // 5. CHANGELOG/CONTRIBUTING
  const hasChangelog=rootFiles.some(f=>['changelog.md','changelog','contributing.md','contributing'].includes(f.name.toLowerCase()));
  result.scores.changelog=hasChangelog?5:0;
  if (!hasChangelog) result.fixList.push('📋 No CHANGELOG.md or CONTRIBUTING.md found');
  // 6. LICENSE
  const hasLicense=rootFiles.some(f=>['license','license.md','license.txt'].includes(f.name.toLowerCase()));
  result.scores.license=hasLicense?5:0;
  if (!hasLicense) result.fixList.push('⚖️ No LICENSE file found');
  result.total=Object.values(result.scores).reduce((a,b)=>a+b,0);
  return result;
}

function getGrade(score) { return GRADE_TIERS.find(t=>score>=t.min)||GRADE_TIERS[GRADE_TIERS.length-1]; }

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) { return Number(n||0).toLocaleString(); }

function renderBadgePill(badge) {
  return `<span class="badge-pill ${badge.tier}">${badge.icon} ${badge.label}</span>`;
}

function renderSparkline(weeklyCommits) {
  if (!weeklyCommits||weeklyCommits.length<2) return '';
  const vals=weeklyCommits.map(w=>w.c), max=Math.max(...vals,1);
  const W=100,H=28,pad=2;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(W-2*pad);
    const y=H-pad-((v/max)*(H-2*pad));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<div class="sparkline-wrap">
    <div class="sparkline-label">Commit activity (30d)</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <polyline points="${pts}" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></div>`;
}

function renderHallOfShame(metricsMap, commitList) {
  const lazyCounts={};
  for (const login of Object.keys(metricsMap)) lazyCounts[login]=0;
  for (const c of commitList) {
    const login=c.author?.login;
    if (login&&lazyCounts[login]!==undefined&&isLazyCommit(c.commit?.message)) lazyCounts[login]++;
  }
  const lazyTop=Object.entries(lazyCounts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const fridayDevs=Object.values(metricsMap).filter(m=>m.friday_commits>=3).sort((a,b)=>b.friday_commits-a.friday_commits);
  const cards=[];
  if (lazyTop.length) {
    const [name,count]=lazyTop[0];
    const r=['😬','🥲','😬'][Math.abs(name.charCodeAt(0))%3];
    cards.push(`<div class="shame-card"><div class="shame-icon">${r}</div>
      <div class="shame-title">Lazy Commit Award</div>
      <div class="shame-name">${name}</div>
      <div class="shame-roast">${count} commits with messages like "fix" or "wip". Future you is already suffering.</div></div>`);
  }
  for (const m of fridayDevs.slice(0,2)) {
    cards.push(`<div class="shame-card"><div class="shame-icon">💀</div>
      <div class="shame-title">Friday Deployer</div>
      <div class="shame-name">${m.login}</div>
      <div class="shame-roast">${m.friday_commits} pushes on a Friday. Production is just a vibe.</div></div>`);
  }
  if (!cards.length) return '';
  return `<div class="section-label">Hall of Shame</div>
    <div class="shame-grid">${cards.join('')}</div>`;
}

function renderPlayerStatsStrip(metricsMap, badgeMap) {
  const players=Object.values(metricsMap);
  if (!players.length) return '';
  const totalXP   = players.reduce((s,m)=>s+computeXP(m,(badgeMap[m.login]||[]).length),0);
  const topPlayer = players.sort((a,b)=>computeXP(b,(badgeMap[b.login]||[]).length)-computeXP(a,(badgeMap[a.login]||[]).length))[0];
  const topLevel  = getLevelData(computeXP(topPlayer,(badgeMap[topPlayer.login]||[]).length));
  const totalCommits=players.reduce((s,m)=>s+m.total_commits,0);
  const totalLines  =players.reduce((s,m)=>s+m.lines_added,0);
  const topStreak   =players.reduce((best,m)=>m.streak>best.streak?m:best,players[0]);
  const topNight    =players.reduce((best,m)=>m.night_commits>best.night_commits?m:best,players[0]);
  const topEarly    =players.reduce((best,m)=>m.early_commits>best.early_commits?m:best,players[0]);
  const stats=[
    {label:'Team XP',      value:fmt(totalXP),         sub:'total earned'},
    {label:'Top level',    value:topLevel.idx,          sub:topLevel.title},
    {label:'Active players', value:players.length,      sub:'last 30 days'},
    {label:'Team commits', value:fmt(totalCommits),     sub:'last 30 days'},
    {label:'Lines written', value:`+${fmt(totalLines)}`, sub:'last 30 days'},
    {label:'Longest streak', value:`${topStreak.streak}d`, sub:topStreak.login},
    {label:'Night shift',  value:topNight.login,        sub:`${topNight.night_commits} late commits`},
    {label:'Early riser',  value:topEarly.login,        sub:`${topEarly.early_commits} before 10am`},

  return `<div class="section-label">Player Stats</div>

      <div class="stat-card">
        <div class="stat-label">${s.label}</div>
        <div class="stat-value" style="font-size:17px">${s.value}</div>
        <div class="stat-sub">${s.sub}</div>

      <div class="level-info">
        <div class="level-title" style="color:${barColor}">${level.emoji} ${level.title}</div>
        <div class="level-xp">⚡ ${fmt(xp)} XP</div>
      </div>
    </div>
    <div class="xp-bar-wrap">
      <div class="xp-bar-label">
        <span>Level ${level.idx}</span>
        <span>${level.progress}% → Level ${level.idx+1}</span>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" style="width:${level.progress}%;background:${barColor}"></div>
      </div>
    </div>
    <div class="player-stat-grid">
      <div class="player-mini">
        <div class="player-mini-val">${m.total_commits}</div>
        <div class="player-mini-lbl">Commits</div>
      </div>
      <div class="player-mini">
        <div class="player-mini-val">+${fmt(m.lines_added)}</div>
        <div class="player-mini-lbl">Lines +</div>
      </div>
      <div class="player-mini">
        <div class="player-mini-val">-${fmt(m.lines_deleted)}</div>
        <div class="player-mini-lbl">Lines −</div>
      </div>
      <div class="player-mini">
        <div class="player-mini-val">${m.streak}d</div>
        <div class="player-mini-lbl">Streak</div>
      </div>
    </div>
    ${actChips?`<div class="activity-row">${actChips}</div>`:''}
    ${badges.length?`<div class="card-badges">${badges.map(b=>renderBadgePill(b)).join('')}</div>`:''}
    ${renderSparkline(m.weekly_commits)}
  </div>`;
}

function renderPlayersTab(metricsMap, badgeMap) {
  const sorted = Object.values(metricsMap)
    .map(m=>({m, xp:computeXP(m,(badgeMap[m.login]||[]).length)}))
    .sort((a,b)=>b.xp-a.xp);
  const cards = sorted.map(({m},i)=>renderPlayerCard(m,badgeMap[m.login]||[],i+1,i)).join('');
  return renderPlayerStatsStrip(metricsMap, badgeMap) +
    `<div class="section-label">Player Cards</div>
     <div class="player-grid">${cards}</div>`;
}

/* ═══════════════════════════════════════════
   WANDERING CONTRIBUTOR SPRITES
═══════════════════════════════════════════ */
function initWanderers(metricsMap) {
  const bar = document.getElementById('wanderer-bar');
  bar.style.display = 'block';
  const players = Object.values(metricsMap).sort((a,b)=>b.total_commits-a.total_commits);
  // Show up to 5 wanderers; fill with extra if fewer contributors
  const slots = [
    {dur:'13s', delay:'0s',   dir:'right'},
    {dur:'18s', delay:'5s',   dir:'left'},
    {dur:'15s', delay:'10s',  dir:'right'},
    {dur:'20s', delay:'2s',   dir:'left'},
    {dur:'12s', delay:'7s',   dir:'right'},
  ];
  bar.innerHTML = slots.map((slot, i) => {
    const player = players[i % players.length];
    if (!player) return '';
    const spriteIdx = i % SPRITES.length;
    const cls = slot.dir==='right' ? 'w-go-right' : 'w-go-left';
    return `<div class="wanderer ${cls}" style="--dur:${slot.dur};--delay:${slot.delay}">
      ${renderSprite(spriteIdx, 4, '')}
      <div class="wanderer-name">${player.login}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   SETUP / LOADING SCREENS
═══════════════════════════════════════════ */
function renderSetup(prefillRepo='', prefillToken='', err='') {
  return `<div class="setup-wrap">
    <div class="setup-logo">github <span>leaderboard</span> ✦</div>
    <div class="setup-card">
      <div><label>GitHub Repo</label>
        <input id="inp-repo" type="text" placeholder="owner/repo" value="${escHtml(prefillRepo)}"></div>
      <div><label>Personal Access Token</label>
        <input id="inp-token" type="password" placeholder="github_pat_..." value="${escHtml(prefillToken)}"></div>
      ${err?`<div class="error-msg">${escHtml(err)}</div>`:''}
      <button class="btn-primary" onclick="handleConnect()">Connect →</button>
    </div></div>`;
}

function renderLoading(repo) {
  return `<div class="top-bar">
      <div class="top-title">github leaderboard ✦ <span class="repo-name">${escHtml(repo)}</span></div>
    </div>
    <div class="loading-wrap">
      <div class="section-label">Repo Overview</div>
      <div class="skel-strip">${Array(8).fill('<div class="skeleton skel-card"></div>').join('')}</div>
      <div class="section-label">Doc Health</div>
      <div class="skeleton skel-block"></div>
      <div class="section-label">Players</div>
      <div class="skel-grid">${Array(3).fill('<div class="skeleton skel-lcard"></div>').join('')}</div>
    </div>`;
}

/* ═══════════════════════════════════════════
   TAB SWITCHING
═══════════════════════════════════════════ */
let _state = null;
let _currentTab = 'repo';

function switchTab(tab) {
  _currentTab = tab;
  if (!_state) return;
  document.getElementById('tab-repo').classList.toggle('active', tab==='repo');
  document.getElementById('tab-players').classList.toggle('active', tab==='players');
  document.getElementById('tab-content').innerHTML = tab==='repo'
    ? renderRepoTabContent(_state)
    : renderPlayersTab(_state.metricsMap, _state.badgeMap);
}

function renderTabBar() {
  return `<div class="tab-bar">
    <button class="tab-btn ${_currentTab==='repo'?'active':''}" id="tab-repo" onclick="switchTab('repo')">🏛 Repo</button>
    <button class="tab-btn ${_currentTab==='players'?'active':''}" id="tab-players" onclick="switchTab('players')">🎮 Players</button>
  </div>`;
}

function renderRepoTabContent(s) {
  return renderStatsStrip(s.repoData, s.langs, s.contribs)
    + renderDocHealth(s.health)
    + renderLeaderboard(s.metricsMap, s.badgeMap)
    + renderHallOfShame(s.metricsMap, s.commitList);
}

/* ═══════════════════════════════════════════
   SETTINGS MODAL
═══════════════════════════════════════════ */
function openSettings() {
  const el=document.createElement('div');
  el.id='settings-modal';
  el.className='modal-overlay';
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.innerHTML=`<div class="modal-box">
    <div style="font-size:15px;font-weight:500">Settings</div>
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.3rem">GitHub Repo</label>
      <input id="set-repo" type="text" value="${escHtml(getRepo())}"></div>
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.3rem">Personal Access Token</label>
      <input id="set-token" type="password" value="${escHtml(getToken())}"></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn-sm" onclick="document.getElementById('settings-modal').remove()">Cancel</button>
      <button class="btn-primary" onclick="saveSettings()">Save & Reload</button>
    </div></div>`;
  document.body.appendChild(el);
}

function saveSettings() {
  const repo=document.getElementById('set-repo')?.value?.trim();
  const tok =document.getElementById('set-token')?.value?.trim();
  if (!repo||!tok) return;
  localStorage.setItem(REPO_KEY,repo);
  localStorage.setItem(TOKEN_KEY,tok);
  document.getElementById('settings-modal')?.remove();
  refreshData();
}

/* ═══════════════════════════════════════════
   MAIN LOAD
═══════════════════════════════════════════ */
function fireConfetti() {
  if (typeof confetti!=='function') return;
  confetti({particleCount:130,spread:85,origin:{y:0.6},
    colors:['#7F77DD','#EF9F27','#4ade80','#f87171','#60a5fa']});
}

async function loadData() {
  const repo=getRepo(), app=document.getElementById('app');
  app.innerHTML=renderLoading(repo);
  try {
    const [{data:repoData},{data:langs},contribs]=await Promise.all([
      ghFetch(`/repos/${repo}`),
      ghFetch(`/repos/${repo}/languages`),
      fetchAllPages(`/repos/${repo}/contributors`),
    ]);
    const since=daysAgo(30);
    const [commitList, statsResult, health]=await Promise.all([
      fetchAllPages(`/repos/${repo}/commits?since=${since}`,500),
      pollStats(`/repos/${repo}/stats/contributors`),
      computeDocHealth(repo),
    ]);
    const statsData=statsResult?.data||[];
    const metricsMap=computeContributorMetrics(statsData,commitList);
    const badgeMap  =assignBadges(metricsMap);

    _state={repoData,langs,contribs,commitList,health,metricsMap,badgeMap};

    app.innerHTML=`
      <div class="top-bar">
        <div class="top-title">github leaderboard ✦ <span class="repo-name">${escHtml(repo)}</span></div>
        <div class="top-actions">
          <button class="btn-sm" onclick="refreshData()">↻ Refresh</button>
          <button class="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
        </div>
      </div>
      ${renderTabBar()}
      <div id="tab-content">${renderRepoTabContent(_state)}</div>`;

    document.getElementById('last-updated').textContent=`Updated ${new Date().toLocaleTimeString()}`;
    initWanderers(metricsMap);
    setTimeout(fireConfetti,500);
  } catch(err) {
    app.innerHTML=`<div class="setup-wrap">
      <div class="setup-logo">github <span>leaderboard</span> ✦</div>
      <div class="setup-card">
        <div class="error-msg">${escHtml(err.message)}</div>
        <button class="btn-primary" onclick="resetAndSetup()">Update settings</button>
      </div></div>`;
  }
}

function handleConnect() {
  const repo =document.getElementById('inp-repo')?.value?.trim();
  const token=document.getElementById('inp-token')?.value?.trim();
  if (!repo||!token) { document.getElementById('app').innerHTML=renderSetup(repo,token,'Please enter both repo and token.'); return; }
  localStorage.setItem(REPO_KEY,repo);
  localStorage.setItem(TOKEN_KEY,token);
  _cache.clear(); apiCallCount=0;
  loadData();
}

function refreshData() { _cache.clear(); apiCallCount=0; document.getElementById('api-counter').textContent='0 / 5000 API calls'; loadData(); }
function resetAndSetup() { document.getElementById('app').innerHTML=renderSetup(getRepo(),getToken()); }

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function init() {
  if (!localStorage.getItem(REPO_KEY)) localStorage.setItem(REPO_KEY,DEFAULT_REPO);
  if (!getToken()) document.getElementById('app').innerHTML=renderSetup(getRepo(),'');
  else loadData();
}
init();
</script>
</body>
